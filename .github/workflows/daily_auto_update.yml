name: Daily News Watchdog

on:
  schedule:
    # GitHub 排程實測延遲約 110 分鐘（越整點越塞），改用奇數分並緊跟 CCR 之後
    - cron: '22 23 * * *'
    - cron: '38 23 * * *'
    - cron: '53 23 * * *'
    - cron: '17 0 * * *'
    - cron: '41 0 * * *'
    - cron: '13 1 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install feedparser
      - name: Watchdog check and update if needed
        run: python .github/scripts/auto_news.py
      - name: Commit and push
        id: push
        run: |
          git config user.email "tzuyun@ischool.com.tw"
          git config user.name "auto-news-bot"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes (CCR succeeded or watchdog skipped)"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            TODAY=$(TZ=Asia/Taipei date '+%Y-%m-%d')
            git commit -m "Daily update: ${TODAY} - watchdog fallback"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
            echo "Watchdog pushed fallback content"
          fi
      # 用 GITHUB_TOKEN 推送不會觸發其他 workflow（GitHub 防遞迴機制），
      # 所以看門狗補的內容必須自己廣播，否則 LINE 收不到。
      - name: Broadcast to LINE (watchdog pushes do not trigger daily_broadcast.yml)
        if: steps.push.outputs.pushed == 'true'
        env:
          LINE_TOKEN_QUICK: ${{ secrets.LINE_TOKEN_QUICK }}
        run: python3 broadcast_daily.py
